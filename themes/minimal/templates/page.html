{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ config.title }}{% endblock title %}

{% block content %}
<article class="post">
    <a class="back-link" href="{{ config.base_url }}">&larr; 返回</a>
    <h1 class="post-heading">{{ page.title }}</h1>
    <time class="post-date-single">{{ page.date | date(format="%Y-%m-%d") }}</time>
    <div class="post-content">
        {{ page.content | safe }}
    </div>
</article>
{% endblock content %}

{% extends "base.html" %}
{% import "macros/header.html" as macros %}

{% block content %}
{{ macros::site_header() }}

<main>
    <ul class="post-list">
    {% for page in section.pages %}
        <li class="post-item">
            <a class="post-title" href="{{ page.permalink }}">{{ page.title }}</a>
            <time class="post-date">{{ page.date | date(format="%Y-%m-%d") }}</time>
        </li>
    {% endfor %}
    </ul>
</main>
{% endblock content %}
